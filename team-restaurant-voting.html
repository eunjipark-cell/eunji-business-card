<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제품개발팀 회식 투표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="app-style">
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}

:root{
  --ground:#F1F3EE;
  --surface:#FFFFFF;
  --surface-2:#F7F8F4;
  --line:#DDE2D7;
  --line-soft:#E9EDE5;
  --ink:#17231F;
  --ink-soft:#5C6B65;
  --ink-faint:#8B968F;
  --accent:#8E2F4B;
  --accent-ink:#FFFFFF;
  --accent-wash:#F6E9ED;
  --gold:#9C6716;
  --cat-korean:#2E5D4B;
  --cat-meat:#A34426;
  --cat-chinese:#8E2F4B;
  --cat-japanese:#33507E;
  --cat-western:#6B4E93;
  --cat-cafe:#7A5334;
  --cat-etc:#4E5C57;
  --shadow:0 1px 2px rgba(23,35,31,.05),0 10px 24px -18px rgba(23,35,31,.45);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111612;
    --surface:#1A211D;
    --surface-2:#212A25;
    --line:#2E3A34;
    --line-soft:#26302B;
    --ink:#E8EDE7;
    --ink-soft:#9EACA5;
    --ink-faint:#78857F;
    --accent:#E08AA3;
    --accent-ink:#231018;
    --accent-wash:#2A1A20;
    --gold:#D9A94E;
    --cat-korean:#7FC0A4;
    --cat-meat:#E79372;
    --cat-chinese:#E28AA5;
    --cat-japanese:#93B2E4;
    --cat-western:#BFA7E0;
    --cat-cafe:#C99A6E;
    --cat-etc:#A3B2AC;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#111612;
  --surface:#1A211D;
  --surface-2:#212A25;
  --line:#2E3A34;
  --line-soft:#26302B;
  --ink:#E8EDE7;
  --ink-soft:#9EACA5;
  --ink-faint:#78857F;
  --accent:#E08AA3;
  --accent-ink:#231018;
  --accent-wash:#2A1A20;
  --gold:#D9A94E;
  --cat-korean:#7FC0A4;
  --cat-meat:#E79372;
  --cat-chinese:#E28AA5;
  --cat-japanese:#93B2E4;
  --cat-western:#BFA7E0;
  --cat-cafe:#C99A6E;
  --cat-etc:#A3B2AC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -20px rgba(0,0,0,.9);
}

body{
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 72px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.serif{font-family:"Gowun Batang","Nanum Myeongjo",serif}

/* ---------- header ---------- */
.masthead{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:22px 24px;
  display:flex;
  flex-wrap:nowrap;
  gap:24px;
  align-items:flex-end;
}
.masthead > div:first-child{flex:1 1 auto;min-width:0}
.mast-title{
  font-family:"Gowun Batang","Nanum Myeongjo",serif;
  font-weight:700;
  font-size:clamp(32px,5.2vw,42px);
  letter-spacing:-.01em;
  line-height:1.15;
  text-wrap:balance;
}
.mast-sub{
  margin-top:6px;
  font-size:13.5px;
  color:var(--ink-soft);
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
}
.weather-box{
  margin-top:8px;
  font-size:13px;
  display:flex;
  gap:6px;
  align-items:center;
  padding:8px 12px;
  background:var(--surface-2);
  border-radius:8px;
  border:1px solid var(--line-soft);
  flex-wrap:wrap;
}
.weather-emoji{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:6px !important;
  padding:4px 8px !important;
  cursor:pointer !important;
  font-size:18px !important;
  transition:all 0.2s !important;
  line-height:1 !important;
}
.weather-emoji:hover{
  border-color:var(--accent) !important;
  transform:scale(1.1);
}
.weather-emoji.selected{
  background:var(--accent) !important;
  border-color:var(--accent) !important;
  box-shadow:0 0 8px rgba(142,47,75,.3) !important;
}
.weather-icon{font-size:18px;line-height:1}
.weather-info{display:flex;flex-direction:column;gap:2px}
.origin-tag{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.02em;
  color:var(--gold);
  border:1px dashed color-mix(in oklab,var(--gold) 45%,transparent);
  border-radius:999px;
  padding:3px 10px;
}
.mast-tools{display:flex;flex-direction:column;gap:10px;align-items:flex-end;flex:0 0 auto;margin-left:auto}
.me-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.me-box label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
input[type="text"],input[type="date"],input[type="number"],select,textarea{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:7px 10px;
  font-size:13.5px;
  min-width:0;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.btn{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:7px 13px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:border-color .15s ease,background .15s ease,transform .15s ease;
}
.btn:hover{border-color:var(--ink-faint)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{border-color:var(--accent);filter:brightness(1.06)}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin:26px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;
  padding:10px 14px;margin-bottom:-1px;cursor:pointer;
  font-size:15.5px;font-weight:500;color:var(--ink-soft);
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .count{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-faint);margin-left:6px}

/* ---------- filter chips ---------- */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:5px 13px;
  font-size:13px;
  cursor:pointer;
  color:var(--ink-soft);
  transition:border-color .15s ease,color .15s ease,background .15s ease;
}
.chip:hover{border-color:var(--ink-faint)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:500}
.chip .n{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.75;margin-left:5px}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.card.is-visited{opacity:.82}
.card-body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:9px}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat{
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:3px 9px;border-radius:6px;
  color:var(--c);
  background:color-mix(in oklab,var(--c) 12%,transparent);
  border:1px solid color-mix(in oklab,var(--c) 30%,transparent);
}
.place-name{
  font-family:"Gowun Batang","Nanum Myeongjo",serif;
  font-weight:700;font-size:21px;line-height:1.3;letter-spacing:-.01em;
}
.meta{font-size:13px;color:var(--ink-soft);display:flex;gap:7px;align-items:baseline}
.meta .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);flex:0 0 42px;padding-top:2px}
.meta a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in oklab,var(--accent) 35%,transparent);white-space:nowrap}
.meta a:hover{border-bottom-color:var(--accent)}
.menus{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.menus li{
  font-size:12.5px;
  background:var(--surface-2);
  border:1px solid var(--line-soft);
  border-radius:7px;
  padding:3px 9px;
  color:var(--ink-soft);
}
.note{font-size:13px;color:var(--ink-soft);font-style:italic}
.perf{
  height:1px;flex:0 0 1px;
  background-image:repeating-linear-gradient(to right,var(--line) 0 5px,transparent 5px 11px);
}
.card-strip{padding:13px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vote-btn{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line);background:var(--surface-2);
  border-radius:999px;padding:6px 15px;cursor:pointer;font-size:13.5px;font-weight:500;
  transition:border-color .15s ease,background .15s ease,color .15s ease;
}
.vote-btn .num{font-family:"IBM Plex Mono",monospace;font-weight:600}
.vote-btn:hover{border-color:var(--accent);color:var(--accent)}
.vote-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.voters{font-size:12px;color:var(--ink-faint);line-height:1.4}
.card-visit{padding:13px 18px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.visit-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.visit-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.visit-list{display:flex;flex-direction:column;gap:6px}
.visit-item{display:flex;gap:9px;align-items:baseline;font-size:13px}
.visit-item .d{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--cat-korean)}
.x{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:12px;padding:0 2px;line-height:1}
.x:hover{color:var(--accent)}
.stamp{
  font-family:"Gowun Batang",serif;font-weight:700;font-size:12px;
  color:var(--cat-korean);border:1.5px solid color-mix(in oklab,var(--cat-korean) 50%,transparent);
  border-radius:6px;padding:1px 8px;transform:rotate(-3deg);
}

/* ---------- results ---------- */
.summary{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.stat .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;line-height:1.3}
.stat .v small{font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:3px}
.rank{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rank-row{display:flex;gap:14px;align-items:flex-start;padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.rank-row:last-child{border-bottom:none}
.rank-row.top{background:var(--accent-wash)}
.rank-n{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--ink-faint);flex:0 0 26px;padding-top:3px}
.rank-row.top .rank-n{color:var(--accent)}
.rank-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rank-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.rank-name{font-family:"Gowun Batang",serif;font-weight:700;font-size:17px}
.bar-track{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line-soft)}
.bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.rank-votes{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;flex:0 0 auto;padding-top:2px}
.tally{display:flex;flex-direction:column;gap:9px;margin-top:22px}
.tally-row{display:flex;align-items:center;gap:10px;font-size:13px}
.tally-row .lab{flex:0 0 76px;font-weight:500;color:var(--c)}
.tally-row .track{flex:1;height:9px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:99px;overflow:hidden}
.tally-row .fill{height:100%;background:var(--c)}
.tally-row .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;flex:0 0 34px;text-align:right;color:var(--ink-soft)}

/* ---------- log ---------- */
.log{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log-row{display:flex;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line-soft);align-items:flex-start;flex-wrap:wrap}
.log-row:last-child{border-bottom:none}
.log-date{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--gold);flex:0 0 92px}
.log-main{flex:1;min-width:180px;display:flex;flex-direction:column;gap:5px}
.log-name{font-family:"Gowun Batang",serif;font-weight:700;font-size:17px}

.section-title{
  font-family:"Gowun Batang",serif;font-weight:700;font-size:17px;
  margin:28px 0 12px;display:flex;align-items:center;gap:10px;
}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{
  border:1px dashed var(--line);border-radius:var(--r);
  padding:44px 26px;text-align:center;color:var(--ink-soft);background:var(--surface);
}
.empty .big{font-family:"Gowun Batang",serif;font-size:19px;font-weight:700;color:var(--ink);margin-bottom:8px}
.empty p{font-size:13.5px;max-width:42ch;margin:0 auto}
.notice{
  background:var(--accent-wash);border:1px solid color-mix(in oklab,var(--accent) 28%,transparent);
  border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:18px;color:var(--ink);
}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:999px;
  font-size:13px;font-weight:500;box-shadow:0 10px 30px -12px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;
  max-width:min(90vw,420px);text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer.foot{margin-top:40px;font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.7}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}
@media (max-width:560px){
  .wrap{padding:18px 14px 60px}
  .masthead{padding:18px;flex-wrap:wrap}
  .masthead > div:first-child{flex:0 0 100%;margin-bottom:8px}
  .mast-tools{align-items:stretch;width:100%;margin-left:0}
  .me-box{width:100%}
  .me-box input{flex:1}
}
</style>
</head>

            "</div>" +
            weatherHtml +
          "</div>" +
          adminHtml +
        '</div>' +
        '<div class="mast-tools" style="margin-top:16px;gap:10px">' +
          (ui.isAdmin ? '<div class="me-box">' +
            '<label for="new-outing-label">새 회식</label>' +
            '<input type="text" id="new-outing-label" placeholder="예: 09/18(금) 점심 회식" maxlength="30">' +
            '<input type="date" id="new-outing-date">' +
            '<button class="btn btn-sm" data-act="add-outing">추가</button>' +
          "</div>" : "") +
          '<div class="me-box">' +
            '<label for="outing-select">회식</label>' +
            '<select id="outing-select" data-act="select-outing">' +
              state.outings.map(function (o) {
                return '<option value="' + o.id + '"' + (o.id === state.currentOuting ? ' selected' : '') + '>' + esc(o.label) + '</option>';
              }).join("") +
            '</select>' +
            (ui.isAdmin && state.currentOuting && state.outings.length > 0 ? '<div style="margin-top:8px;display:flex;gap:6px">' +
              '<input type="text" id="edit-outing-name" value="' + esc(currentOuting.label) + '" maxlength="30" placeholder="회식 이름" style="flex:1;font-size:13px">' +
              '<button class="btn btn-sm" data-act="update-outing-name">저장</button>' +
              '<button class="btn btn-sm" data-act="delete-outing" style="background:#f5755d;color:white">삭제</button>' +
            '</div>' : "") +
          "</div>" +
        "</div>" +
      "</header>";
  }

  function tabs() {
    var currentLabel = "";
    var currentOuting = null;
    for (var i = 0; i < state.outings.length; i++) {
      if (state.outings[i].id === state.currentOuting) {
        currentLabel = state.outings[i].label;
        currentOuting = state.outings[i];
        break;
      }
    }
    var isPending = false;
    var isVotingOpen = false;
    if (currentOuting && currentOuting.status === "pending") {
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var outingDate = new Date(currentOuting.date);
      if (outingDate >= today) {
        isPending = true;
        isVotingOpen = true;
      }
    }
    var selectedCount = currentOuting && currentOuting.selectedPlaceIds ? currentOuting.selectedPlaceIds.length : 0;
    var placesToShow = selectedCount > 0 ? state.places.filter(function (p) { return currentOuting.selectedPlaceIds.indexOf(p.id) >= 0 && !isVisited(p); }) : [];
    var t = [
      { id: "places", label: "후보 목록 · " + currentLabel, n: isVotingOpen ? placesToShow.length : 0, show: true },
      { id: "results", label: "투표 현황" + (currentOuting && currentOuting.date ? " · " + currentOuting.date : ""), n: isPending ? allVoters().length : 0, show: !isPending || ui.isAdmin || currentOuting.status === "completed" },
      { id: "log", label: "다녀온 곳", n: state.places.filter(isVisited).length, show: true }
    ];
    return '<div class="tabs" role="tablist">' + t.filter(function(x) { return x.show; }).map(function (x) {
      return '<button class="tab" role="tab" aria-selected="' + (ui.tab === x.id ? "true" : "false") +
             '" data-act="tab" data-id="' + x.id + '">' + x.label +
             '<span class="count">' + x.n + "</span></button>";
    }).join("") + "</div>";
  }

  /* ----- tab 1: places ----- */

  function placesTab() {
    var out = "";
    var currentOuting = null;
    for (var i = 0; i < state.outings.length; i++) {
      if (state.outings[i].id === state.currentOuting) {
        currentOuting = state.outings[i];
        break;
      }
    }

    if (writable === false) {
      out += '<div class="notice">이 화면은 읽기 전용이에요. 투표가 저장되려면 은지님이 공유할 때 <strong>편집 가능</strong>으로 공유해야 합니다.</div>';
    }

    if (currentOuting && currentOuting.date) {
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var outingDate = new Date(currentOuting.date);
      if (outingDate < today) {
        out += '<div class="notice" style="background:#fee;border-color:#f99;">📅 투표 기간이 종료되었습니다.</div>';
      }
    }

    if (currentOuting && (!currentOuting.selectedPlaceIds || currentOuting.selectedPlaceIds.length === 0)) {
      if (ui.isAdmin) {
        out += '<div class="notice" style="background:var(--accent-wash);border-color:var(--accent);">⚙️ 투표할 식당 5개를 선택해 주세요. 아래 버튼을 클릭하세요.</div>' +
               '<button class="btn btn-primary" data-act="select-places" style="margin-bottom:20px">식당 5개 선택</button>';
      } else {
        out += '<div class="empty"><div class="big">아직 식당이 선택되지 않았어요</div>' +
               '<p>은지가 투표할 식당을 선택하면 여기에 나타나요.</p></div>';
      }
      return out;
    }

    out += filters();

    var selectedIds = currentOuting && currentOuting.selectedPlaceIds ? currentOuting.selectedPlaceIds : [];
    var allPlaces = state.places.filter(function (p) {
      return selectedIds.indexOf(p.id) >= 0;
    });

    var list = allPlaces.filter(function (p) {
      return ui.cat === "all" || p.category === ui.cat;
    });
    var live = list.filter(function (p) { return !isVisited(p); });
    var done = list.filter(isVisited);

    live.sort(function (a, b) {
      var d = votesFor(b.id).length - votesFor(a.id).length;
      return d !== 0 ? d : a.name.localeCompare(b.name, "ko");
    });
    done.sort(function (a, b) { return lastVisit(b).localeCompare(lastVisit(a)); });

    if (state.places.length === 0) {
      out += '<div class="empty"><div class="big">아직 후보가 없어요</div>' +
             "<p>은지가 회식 후보를 등록하면 여기에 나타나요. 등록되는 순간부터 팀원들이 투표할 수 있습니다.</p></div>";
      return out;
    }

    if (live.length) out += '<div class="grid">' + live.map(card).join("") + "</div>";
    else out += '<div class="empty"><p>이 분류에는 아직 투표를 기다리는 후보가 없어요.</p></div>';

    if (done.length) {
      out += '<h2 class="section-title">이미 다녀온 곳</h2>' +
             '<div class="grid">' + done.map(card).join("") + "</div>";
    }
    return out;
  }

  function filters() {
    var currentOuting = null;
    for (var i = 0; i < state.outings.length; i++) {
      if (state.outings[i].id === state.currentOuting) {
        currentOuting = state.outings[i];
        break;
      }
    }
    var selectedIds = currentOuting && currentOuting.selectedPlaceIds ? currentOuting.selectedPlaceIds : [];
    var selectedPlaces = state.places.filter(function (p) { return selectedIds.indexOf(p.id) >= 0; });

    var counts = { all: selectedPlaces.length };
    CATS.forEach(function (c) { counts[c.id] = 0; });
    selectedPlaces.forEach(function (p) { counts[p.category] = (counts[p.category] || 0) + 1; });

    var html = '<div class="filters">' +
      '<button class="chip" data-act="cat" data-id="all" aria-pressed="' + (ui.cat === "all" ? "true" : "false") +
      '">전체<span class="n">' + counts.all + "</span></button>";
    CATS.forEach(function (c) {
      html += '<button class="chip" data-act="cat" data-id="' + c.id + '" aria-pressed="' +
              (ui.cat === c.id ? "true" : "false") + '">' + c.label +
              '<span class="n">' + (counts[c.id] || 0) + "</span></button>";
    });
    return html + "</div>";
  }

  function lastVisit(p) {
    if (!isVisited(p)) return "";
    return p.visits.map(function (v) { return v.date || ""; }).sort().pop() || "";
  }

  function card(p) {
    var c = catOf(p.category);
    var vs = votesFor(p.id);
    var mine = vs.indexOf(ui.anonymousId) >= 0;
    var menus = Array.isArray(p.menus) ? p.menus : [];

    var html = '<article class="card' + (isVisited(p) ? " is-visited" : "") + '" style="--c:var(' + c.v + ')">';

    html += '<div class="card-body">';
    html += '<div class="card-head"><span class="cat">' + c.label + "</span>" +
            (isVisited(p) ? '<span class="stamp">다녀옴</span>' : "") + "</div>";
    html += '<h3 class="place-name">' + esc(p.name) + "</h3>";

    html += '<div class="meta"><span class="k">주소</span><span>' +
            (p.address ? esc(p.address) + " " : "") +
            '<a href="' + esc(naverSearchUrl(p)) + '" target="_blank" rel="noopener">네이버 지도에서 검색 ↗</a></span></div>';
    if (p.area) {
      html += '<div class="meta"><span class="k">위치</span><span>' + esc(p.area) + "</span></div>";
    }
    if (menus.length) {
      html += '<div class="meta"><span class="k">메뉴</span><ul class="menus">' +
              menus.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + "</ul></div>";
    }
    if (p.note) html += '<p class="note">' + esc(p.note) + "</p>";

    html += "</div>";

    html += '<div class="perf"></div>';
    html += '<div class="card-strip">' +
            '<button class="vote-btn" data-act="vote" data-id="' + p.id + '" aria-pressed="' + (mine ? "true" : "false") + '">' +
            (mine ? "투표 완료 ✓" : "투표") +
            "</button>" +
            "</div>";

    html += '<div class="perf"></div>';
    html += '<div class="card-visit">' +
            '<span class="visit-label">다녀온 날짜 기록</span>';
    if (isVisited(p)) {
      html += '<ul class="visit-list">' + p.visits.slice().sort(function (a, b) {
        return String(b.date).localeCompare(String(a.date));
      }).map(function (v, i) {
        return '<li class="visit-item"><span class="d">' + esc(v.date) + '</span>' +
               '<button class="x" data-act="del-visit" data-id="' + p.id + '" data-date="' + esc(v.date) +
               '" data-i="' + i + '" title="기록 삭제">✕</button></li>';
      }).join("") + "</ul>";
    }
    html += "</div>";

    html += "</article>";
    return html;
  }

  /* ----- tab 2: results ----- */

  function resultsTab() {
    var currentOuting = null;
    for (var i = 0; i < state.outings.length; i++) {
      if (state.outings[i].id === state.currentOuting) {
        currentOuting = state.outings[i];
        break;
      }
    }
    if (currentOuting && currentOuting.status === "completed") {
      var decidedPlace = null;
      for (var i = 0; i < state.places.length; i++) {
        if (state.places[i].id === currentOuting.decidedPlace) {
          decidedPlace = state.places[i];
          break;
        }
      }
      return '<div class="empty"><div class="big">✓ 투표 완료</div><p>' + (decidedPlace ? esc(decidedPlace.name) + '으로 결정되었습니다.' : '결정된 음식점이 없습니다.') + '</p></div>';
    }
    var voters = allVoters();
    var ranked = state.places.slice().filter(function (p) { return !isVisited(p); });
    ranked.sort(function (a, b) {
      var d = votesFor(b.id).length - votesFor(a.id).length;
      return d !== 0 ? d : a.name.localeCompare(b.name, "ko");
    });
    var totalVotes = 0;
    Object.keys(state.votes).forEach(function (k) { totalVotes += votesFor(k).length; });
    var max = ranked.length ? votesFor(ranked[0].id).length : 0;

    var out = '<div class="summary">' +
      '<div class="stat"><div class="k">투표 참여</div><div class="v">' + voters.length + "<small>명</small></div></div>" +
      '<div class="stat"><div class="k">받은 표</div><div class="v">' + totalVotes + "<small>표</small></div></div>" +
      '<div class="stat"><div class="k">투표 대기 후보</div><div class="v">' + ranked.length + "<small>곳</small></div></div>" +
      '<div class="stat"><div class="k">현재 1위</div><div class="v" style="font-family:\'Gowun Batang\',serif;font-size:19px">' +
        (max > 0 ? esc(ranked[0].name) : "—") + "</div></div>" +
    "</div>";

    if (voters.length) {
      out += '<div class="notice">투표한 사람 · ' + esc(voters.join(", ")) + "</div>";
    }

    if (!ranked.length) {
      out += '<div class="empty"><div class="big">투표할 후보가 없어요</div><p>후보 목록 탭에서 장소를 추가하면 여기에 집계가 쌓입니다.</p></div>';
      return out;
    }

    out += '<div class="rank">' + ranked.map(function (p, i) {
      var c = catOf(p.category);
      var n = votesFor(p.id).length;
      var w = max > 0 ? Math.round((n / max) * 100) : 0;
      var isTop = i === 0 && n > 0;
      return '<div class="rank-row' + (isTop ? " top" : "") + '" style="--c:var(' + c.v + ')">' +
        '<div class="rank-n">' + (i + 1) + "</div>" +
        '<div class="rank-main">' +
          '<div class="rank-head"><span class="rank-name">' + esc(p.name) + "</span>" +
            '<span class="cat">' + c.label + "</span>" +
            (isTop ? '<button class="btn btn-sm" data-act="decide-place" data-id="' + p.id + '" style="margin-left:auto">최종 결정</button>' : "") +
          "</div>" +
          '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%"></div></div>' +
          '<div class="voters">' + (n ? esc(votesFor(p.id).join(", ")) : "아직 투표 없음") + "</div>" +
        "</div>" +
        '<div class="rank-votes">' + n + "표</div>" +
      "</div>";
    }).join("") + "</div>";

    /* 카테고리별 득표 */
    var tally = {};
    CATS.forEach(function (c) { tally[c.id] = 0; });
    state.places.forEach(function (p) { tally[p.category] = (tally[p.category] || 0) + votesFor(p.id).length; });
    var tmax = 0;
    CATS.forEach(function (c) { if (tally[c.id] > tmax) tmax = tally[c.id]; });

    out += '<h2 class="section-title">분류별 선호도</h2><div class="tally">' + CATS.map(function (c) {
      var n = tally[c.id] || 0;
      var w = tmax > 0 ? Math.round((n / tmax) * 100) : 0;
      return '<div class="tally-row" style="--c:var(' + c.v + ')">' +
        '<span class="lab">' + c.label + "</span>" +
        '<span class="track"><span class="fill" style="width:' + w + '%"></span></span>' +
        '<span class="n">' + n + "표</span></div>";
    }).join("") + "</div>";

    return out;
  }

  /* ----- tab 3: visited log ----- */

  function logTab() {
    var rows = [];
    state.places.forEach(function (p) {
      (p.visits || []).forEach(function (v) {
        rows.push({ p: p, v: v });
      });
    });
    rows.sort(function (a, b) { return String(b.v.date).localeCompare(String(a.v.date)); });

    if (!rows.length) {
      return '<div class="empty"><div class="big">아직 회식 기록이 없어요</div>' +
             "<p>투표 결과가 확정되면 방문 날짜가 자동으로 기록됩니다.</p></div>";
    }

    return '<div class="log">' + rows.map(function (r) {
      var c = catOf(r.p.category);
      return '<div class="log-row" style="--c:var(' + c.v + ')">' +
        '<div class="log-date">' + esc(r.v.date) + "</div>" +
        '<div class="log-main">' +
          '<div class="rank-head"><span class="log-name">' + esc(r.p.name) + "</span>" +
          '<span class="cat">' + c.label + "</span></div>" +
          (r.p.address ? '<div class="voters">' + esc(r.p.address) + "</div>" : "") +
        "</div>" +
      "</div>";
    }).join("") + "</div>";
  }

  function foot() {
    return '<footer class="foot">카드의 <strong>네이버 지도에서 검색</strong> 링크를 누르면 가게 이름으로 네이버 지도에서 바로 찾아볼 수 있어요.</footer>';
  }

  /* ---------------- actions ---------------- */

  function val(id) {
    var el = document.getElementById(id);
    return el ? String(el.value).trim() : "";
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    var id = t.getAttribute("data-id");

    if (act === "tab") { ui.tab = id; render(); return; }
    if (act === "cat") { ui.cat = id; render(); return; }

    if (act === "logout-admin") {
      ui.isAdmin = false;
      localStorage.setItem("hoesik.admin", "false");
      render();
      toast("관리자 모드를 종료했습니다.");
      return;
    }

    if (act === "admin-mode") {
      var modal = document.createElement("div");
      modal.id = "admin-login-modal";
      modal.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000";

      var content = document.createElement("div");
      content.style.cssText = "background:var(--surface);border-radius:var(--r);padding:24px;max-width:400px;width:90%;box-shadow:var(--shadow)";

      var title = document.createElement("h2");
      title.textContent = "관리자 비밀번호";
      title.style.cssText = "margin:0 0 16px 0;font-size:18px";
      content.appendChild(title);

      var input = document.createElement("input");
      input.type = "password";
      input.placeholder = "비밀번호를 입력하세요";
      input.style.cssText = "width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:16px;box-sizing:border-box";
      content.appendChild(input);

      var btnContainer = document.createElement("div");
      btnContainer.style.cssText = "display:flex;gap:10px";

      var okBtn = document.createElement("button");
      okBtn.textContent = "확인";
      okBtn.style.cssText = "flex:1;background:var(--accent);color:white;border:none;padding:10px;border-radius:6px;cursor:pointer;font-weight:600";
      okBtn.addEventListener("click", function () {
        if (input.value === "eunji2024") {
          ui.isAdmin = true;
          localStorage.setItem("hoesik.admin", "true");
          document.body.removeChild(modal);
          render();
          toast("관리자 모드로 접속했습니다.");
        } else {
          toast("비밀번호가 틀렸습니다.");
          input.value = "";
          input.focus();
        }
      });

      var cancelBtn = document.createElement("button");
      cancelBtn.textContent = "취소";
      cancelBtn.style.cssText = "flex:1;background:var(--line);color:var(--ink);border:none;padding:10px;border-radius:6px;cursor:pointer";
      cancelBtn.addEventListener("click", function () {
        document.body.removeChild(modal);
      });

      btnContainer.appendChild(okBtn);
      btnContainer.appendChild(cancelBtn);
      content.appendChild(btnContainer);
      modal.appendChild(content);
      document.body.appendChild(modal);
      input.focus();
      return;
    }

    if (act === "select-places") {
      var currentOuting = null;
      for (var i = 0; i < state.outings.length; i++) {
        if (state.outings[i].id === state.currentOuting) {
          currentOuting = state.outings[i];
          break;
        }
      }
      if (!currentOuting) { toast("회식을 선택해주세요."); return; }

      var selectedIds = currentOuting.selectedPlaceIds || [];
      var modal = document.createElement("div");
      modal.id = "place-selector-modal";
      modal.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000";

      var content = document.createElement("div");
      content.style.cssText = "background:var(--surface);border-radius:var(--r);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow)";

      var title = document.createElement("h2");
      title.textContent = "투표할 식당 5개 선택";
      title.style.cssText = "margin:0 0 16px 0;font-size:18px";
      content.appendChild(title);

      var selected = {};
      selectedIds.forEach(function (id) { selected[id] = true; });

      var checkboxContainer = document.createElement("div");
      state.places.forEach(function (p) {
        var c = catOf(p.category);
        var label = document.createElement("label");
        label.style.cssText = "display:flex;align-items:center;margin:10px 0;cursor:pointer;gap:10px";
        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = p.id;
        checkbox.checked = !!selected[p.id];
        checkbox.style.cssText = "cursor:pointer;flex-shrink:0";
        checkbox.addEventListener("change", function () {
          var checked = Array.from(checkboxContainer.querySelectorAll("input[type='checkbox']:checked")).length;
          countEl.textContent = checked;
        });
        label.appendChild(checkbox);
        var textContainer = document.createElement("div");
        textContainer.style.cssText = "display:flex;flex-direction:column;gap:2px;flex:1";
        var nameSpan = document.createElement("span");
        nameSpan.textContent = p.name;
        nameSpan.style.cssText = "font-weight:500";
        var catSpan = document.createElement("span");
        catSpan.textContent = c.label;
        catSpan.style.cssText = "font-size:12px;color:var(--ink-faint)";
        textContainer.appendChild(nameSpan);
        textContainer.appendChild(catSpan);
        label.appendChild(textContainer);
        checkboxContainer.appendChild(label);
      });
      content.appendChild(checkboxContainer);

      var countEl = document.createElement("div");
      countEl.style.cssText = "margin-top:16px;padding:12px;background:var(--surface-2);border-radius:6px;text-align:center";
      countEl.textContent = selectedIds.length;
      var countLabel = document.createElement("div");
      countLabel.style.cssText = "font-size:12px;color:var(--ink-soft)";
      countLabel.textContent = "선택됨 (정확히 5개)";
      content.appendChild(document.createElement("br"));
      content.appendChild(countLabel);
      content.appendChild(countEl);

      var btnContainer = document.createElement("div");
      btnContainer.style.cssText = "margin-top:20px;display:flex;gap:10px";
      var saveBtn = document.createElement("button");
      saveBtn.textContent = "저장";
      saveBtn.className = "btn btn-primary";
      saveBtn.style.cssText = "flex:1;background:var(--accent);color:white;border:none;padding:10px;border-radius:6px;cursor:pointer";
      saveBtn.addEventListener("click", function () {
        var checkboxes = checkboxContainer.querySelectorAll("input[type='checkbox']:checked");
        var newSelected = Array.from(checkboxes).map(function (cb) { return cb.value; });
        if (newSelected.length !== 5) {
          toast("정확히 5개의 식당을 선택해야 합니다. (" + newSelected.length + "개 선택됨)");
          return;
        }
        var n = clone(state);
        for (var i = 0; i < n.outings.length; i++) {
          if (n.outings[i].id === n.currentOuting) {
            n.outings[i].selectedPlaceIds = newSelected;
            n.votes[n.currentOuting] = {};
            break;
          }
        }
        document.body.removeChild(modal);
        commit(n, "식당 5개가 선택되었습니다!");
      });
      var cancelBtn = document.createElement("button");
      cancelBtn.textContent = "취소";
      cancelBtn.className = "btn";
      cancelBtn.style.cssText = "flex:1;background:var(--line);color:var(--ink);border:none;padding:10px;border-radius:6px;cursor:pointer";
      cancelBtn.addEventListener("click", function () {
        document.body.removeChild(modal);
      });
      btnContainer.appendChild(saveBtn);
      btnContainer.appendChild(cancelBtn);
      content.appendChild(btnContainer);

      modal.appendChild(content);
      document.body.appendChild(modal);
      return;
    }

    if (act === "vote") {
      var currentOuting = null;
      for (var i = 0; i < state.outings.length; i++) {
        if (state.outings[i].id === state.currentOuting) {
          currentOuting = state.outings[i];
          break;
        }
      }
      if (!currentOuting) { toast("회식을 선택해주세요."); return; }
      if (!currentOuting.selectedPlaceIds || currentOuting.selectedPlaceIds.length === 0) { toast("선택된 식당이 없습니다."); return; }

      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var outingDate = new Date(currentOuting.date);
      if (outingDate < today) { toast("투표 기간이 종료되었습니다."); return; }

      var n3 = clone(state);
      if (!n3.votes[n3.currentOuting]) n3.votes[n3.currentOuting] = {};
      var list = Array.isArray(n3.votes[n3.currentOuting][id]) ? n3.votes[n3.currentOuting][id] : [];
      var at = list.indexOf(ui.anonymousId);
      var myVoteCount = 0;
      for (var j in n3.votes[n3.currentOuting]) {
        var v = n3.votes[n3.currentOuting][j];
        if (Array.isArray(v) && v.indexOf(ui.anonymousId) >= 0) myVoteCount++;
      }
      if (at < 0 && myVoteCount >= 2) { toast("한 사람당 최대 2개만 투표할 수 있어요."); return; }
      if (at >= 0) list.splice(at, 1); else list.push(ui.anonymousId);
      n3.votes[n3.currentOuting][id] = list;
      commit(n3, at >= 0 ? "투표를 취소했어요." : "투표했어요!");
      return;
    }

    if (act === "add-visit") {
      var date = val("vd-" + id);
      if (!date) { toast("날짜를 골라주세요."); return; }
      var n4 = clone(state);
      n4.places = n4.places.map(function (p) {
        if (p.id !== id) return p;
        var visits = Array.isArray(p.visits) ? p.visits.slice() : [];
        visits.push({ date: date });
        return Object.assign({}, p, { visits: visits });
      });
      commit(n4, date + " 방문 기록 저장!");
      return;
    }

    if (act === "del-visit") {
      var d = t.getAttribute("data-date");
      var n5 = clone(state);
      n5.places = n5.places.map(function (p) {
        if (p.id !== id) return p;
        var removed = false;
        var visits = (p.visits || []).filter(function (v) {
          if (!removed && v.date === d) { removed = true; return false; }
          return true;
        });
        return Object.assign({}, p, { visits: visits });
      });
      commit(n5, "기록을 지웠어요.");
      return;
    }

    if (act === "select-weather") {
      var emoji = t.getAttribute("data-emoji");
      var n = clone(state);
      for (var i = 0; i < n.outings.length; i++) {
        if (n.outings[i].id === n.currentOuting) {
          n.outings[i].weather = n.outings[i].weather === emoji ? "" : emoji;
          break;
        }
      }
      commit(n);
      return;
    }

    if (act === "select-outing") {
      var n6 = clone(state);
      n6.currentOuting = t.value;
      commit(n6);
      return;
    }

    if (act === "add-outing") {
      if (!ui.isAdmin) { toast("관리자만 회식을 추가할 수 있습니다."); return; }
      var label = val("new-outing-label").slice(0, 30);
      var date = val("new-outing-date");
      if (!label) { toast("회식 이름을 입력해 주세요."); return; }
      var n7 = clone(state);
      var outingId = "outing-" + Date.now();
      n7.outings.push({ id: outingId, label: label, date: date, status: "pending", decidedPlace: "", selectedPlaceIds: [] });
      n7.votes[outingId] = {};
      n7.currentOuting = outingId;
      document.getElementById("new-outing-label").value = "";
      document.getElementById("new-outing-date").value = "";
      commit(n7, "회식 '" + label + "'을(를) 추가했어요!");
      return;
    }

    if (act === "decide-place") {
      var n8 = clone(state);
      for (var i = 0; i < n8.outings.length; i++) {
        if (n8.outings[i].id === n8.currentOuting) {
          n8.outings[i].status = "completed";
          n8.outings[i].decidedPlace = id;
          break;
        }
      }
      var placeName = "";
      n8.places = n8.places.map(function (p) {
        if (p.id !== id) return p;
        placeName = p.name;
        var visits = Array.isArray(p.visits) ? p.visits.slice() : [];
        visits.push({ date: today() });
        return Object.assign({}, p, { visits: visits });
      });
      commit(n8, "'" + placeName + "'으로 최종 결정했어요!");
      return;
    }

    if (act === "update-outing-name") {
      if (!ui.isAdmin) { toast("관리자만 회식을 수정할 수 있습니다."); return; }
      var newName = val("edit-outing-name").slice(0, 30);
      if (!newName) { toast("회식 이름을 입력해 주세요."); return; }
      var n9 = clone(state);
      for (var i = 0; i < n9.outings.length; i++) {
        if (n9.outings[i].id === n9.currentOuting) {
          n9.outings[i].label = newName;
          break;
        }
      }
      commit(n9, "회식 이름을 수정했어요!");
      return;
    }

    if (act === "delete-outing") {
      if (!ui.isAdmin) { toast("관리자만 회식을 삭제할 수 있습니다."); return; }
      if (!confirm("이 회식을 삭제하시겠어요? 투표 데이터도 함께 삭제됩니다.")) return;
      var n10 = clone(state);
      n10.outings = n10.outings.filter(function (o) { return o.id !== n10.currentOuting; });
      if (n10.votes[n10.currentOuting]) delete n10.votes[n10.currentOuting];
      n10.currentOuting = n10.outings.length > 0 ? n10.outings[0].id : "";
      commit(n10, "회식을 삭제했어요!");
      return;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var el = e.target;
    if (!el || el.tagName !== "INPUT") return;
    if (el.id === "new-outing-date") {
      var b = document.querySelector('[data-act="add-outing"]');
      if (b) b.click();
    }
  });

  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      api = ns || null;
      if (!api) { writable = false; render(); }
    }).catch(function () { api = null; writable = false; render(); });
  } else {
    writable = false;
  }
})();
</script>
</body>
</html>
