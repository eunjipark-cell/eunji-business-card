<title>제품개발팀 회식 투표소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="app-style">
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}

:root{
  --ground:#F1F3EE;
  --surface:#FFFFFF;
  --surface-2:#F7F8F4;
  --line:#DDE2D7;
  --line-soft:#E9EDE5;
  --ink:#17231F;
  --ink-soft:#5C6B65;
  --ink-faint:#8B968F;
  --accent:#8E2F4B;
  --accent-ink:#FFFFFF;
  --accent-wash:#F6E9ED;
  --gold:#9C6716;
  --cat-korean:#2E5D4B;
  --cat-meat:#A34426;
  --cat-chinese:#8E2F4B;
  --cat-japanese:#33507E;
  --cat-western:#6B4E93;
  --cat-cafe:#7A5334;
  --cat-etc:#4E5C57;
  --shadow:0 1px 2px rgba(23,35,31,.05),0 10px 24px -18px rgba(23,35,31,.45);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111612;
    --surface:#1A211D;
    --surface-2:#212A25;
    --line:#2E3A34;
    --line-soft:#26302B;
    --ink:#E8EDE7;
    --ink-soft:#9EACA5;
    --ink-faint:#78857F;
    --accent:#E08AA3;
    --accent-ink:#231018;
    --accent-wash:#2A1A20;
    --gold:#D9A94E;
    --cat-korean:#7FC0A4;
    --cat-meat:#E79372;
    --cat-chinese:#E28AA5;
    --cat-japanese:#93B2E4;
    --cat-western:#BFA7E0;
    --cat-cafe:#C99A6E;
    --cat-etc:#A3B2AC;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#111612;
  --surface:#1A211D;
  --surface-2:#212A25;
  --line:#2E3A34;
  --line-soft:#26302B;
  --ink:#E8EDE7;
  --ink-soft:#9EACA5;
  --ink-faint:#78857F;
  --accent:#E08AA3;
  --accent-ink:#231018;
  --accent-wash:#2A1A20;
  --gold:#D9A94E;
  --cat-korean:#7FC0A4;
  --cat-meat:#E79372;
  --cat-chinese:#E28AA5;
  --cat-japanese:#93B2E4;
  --cat-western:#BFA7E0;
  --cat-cafe:#C99A6E;
  --cat-etc:#A3B2AC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -20px rgba(0,0,0,.9);
}

body{
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 72px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.serif{font-family:"Gowun Batang","Nanum Myeongjo",serif}

/* ---------- header ---------- */
.masthead{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:22px 24px;
  display:flex;
  flex-wrap:wrap;
  gap:18px 24px;
  align-items:flex-end;
  justify-content:space-between;
}
.mast-title{
  font-family:"Gowun Batang","Nanum Myeongjo",serif;
  font-weight:700;
  font-size:clamp(26px,4.2vw,36px);
  letter-spacing:-.01em;
  line-height:1.15;
  text-wrap:balance;
}
.mast-sub{
  margin-top:8px;
  font-size:12.5px;
  color:var(--ink-soft);
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
}
.origin-tag{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  letter-spacing:.02em;
  color:var(--gold);
  border:1px dashed color-mix(in oklab,var(--gold) 45%,transparent);
  border-radius:999px;
  padding:3px 10px;
}
.mast-tools{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.me-box{display:flex;gap:8px;align-items:center}
.me-box label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
input[type="text"],input[type="date"],input[type="number"],select,textarea{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:7px 10px;
  font-size:13.5px;
  min-width:0;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.btn{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:7px 13px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:border-color .15s ease,background .15s ease,transform .15s ease;
}
.btn:hover{border-color:var(--ink-faint)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{border-color:var(--accent);filter:brightness(1.06)}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin:26px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;
  padding:10px 14px;margin-bottom:-1px;cursor:pointer;
  font-size:14.5px;font-weight:500;color:var(--ink-soft);
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .count{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-faint);margin-left:6px}

/* ---------- filter chips ---------- */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:5px 13px;
  font-size:13px;
  cursor:pointer;
  color:var(--ink-soft);
  transition:border-color .15s ease,color .15s ease,background .15s ease;
}
.chip:hover{border-color:var(--ink-faint)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:500}
.chip .n{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.75;margin-left:5px}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.card.is-visited{opacity:.82}
.card-body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:9px}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat{
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:3px 9px;border-radius:6px;
  color:var(--c);
  background:color-mix(in oklab,var(--c) 12%,transparent);
  border:1px solid color-mix(in oklab,var(--c) 30%,transparent);
}
.drive{
  margin-left:auto;
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;font-weight:600;
  color:var(--gold);
  white-space:nowrap;
}
.drive.empty{color:var(--ink-faint);font-weight:500}
.place-name{
  font-family:"Gowun Batang","Nanum Myeongjo",serif;
  font-weight:700;font-size:21px;line-height:1.3;letter-spacing:-.01em;
}
.meta{font-size:13px;color:var(--ink-soft);display:flex;gap:7px;align-items:baseline}
.meta .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);flex:0 0 42px;padding-top:2px}
.meta a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in oklab,var(--accent) 35%,transparent);white-space:nowrap}
.meta a:hover{border-bottom-color:var(--accent)}
.menus{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.menus li{
  font-size:12.5px;
  background:var(--surface-2);
  border:1px solid var(--line-soft);
  border-radius:7px;
  padding:3px 9px;
  color:var(--ink-soft);
}
.note{font-size:13px;color:var(--ink-soft);font-style:italic}
.perf{
  height:1px;flex:0 0 1px;
  background-image:repeating-linear-gradient(to right,var(--line) 0 5px,transparent 5px 11px);
}
.card-strip{padding:13px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vote-btn{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line);background:var(--surface-2);
  border-radius:999px;padding:6px 15px;cursor:pointer;font-size:13.5px;font-weight:500;
  transition:border-color .15s ease,background .15s ease,color .15s ease;
}
.vote-btn .num{font-family:"IBM Plex Mono",monospace;font-weight:600}
.vote-btn:hover{border-color:var(--accent);color:var(--accent)}
.vote-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.voters{font-size:12px;color:var(--ink-faint);line-height:1.4}
.card-visit{padding:13px 18px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.visit-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.visit-form{display:flex;gap:6px;flex-wrap:wrap}
.visit-form input[type="date"]{flex:0 0 auto}
.visit-form input[type="text"]{flex:1 1 110px}
.visit-list{display:flex;flex-direction:column;gap:6px}
.visit-item{display:flex;gap:9px;align-items:baseline;font-size:13px}
.visit-item .d{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--cat-korean);flex:0 0 auto}
.visit-item .m{color:var(--ink-soft);flex:1}
.x{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:12px;padding:0 2px;line-height:1}
.x:hover{color:var(--accent)}
.stamp{
  font-family:"Gowun Batang",serif;font-weight:700;font-size:12px;
  color:var(--cat-korean);border:1.5px solid color-mix(in oklab,var(--cat-korean) 50%,transparent);
  border-radius:6px;padding:1px 8px;transform:rotate(-3deg);
}

/* ---------- forms ---------- */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;margin-bottom:18px;box-shadow:var(--shadow);
}
.panel h3{font-family:"Gowun Batang",serif;font-size:18px;font-weight:700;margin-bottom:14px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.field{display:flex;flex-direction:column;gap:5px}
.field.wide{grid-column:1/-1}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.field .hint{font-size:11.5px;color:var(--ink-faint);letter-spacing:0;text-transform:none}
.form-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}

/* ---------- results ---------- */
.summary{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.stat .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;line-height:1.3}
.stat .v small{font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:3px}
.rank{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rank-row{display:flex;gap:14px;align-items:flex-start;padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.rank-row:last-child{border-bottom:none}
.rank-row.top{background:var(--accent-wash)}
.rank-n{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--ink-faint);flex:0 0 26px;padding-top:3px}
.rank-row.top .rank-n{color:var(--accent)}
.rank-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rank-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.rank-name{font-family:"Gowun Batang",serif;font-weight:700;font-size:17px}
.bar-track{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line-soft)}
.bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.rank-votes{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;flex:0 0 auto;padding-top:2px}
.tally{display:flex;flex-direction:column;gap:9px;margin-top:22px}
.tally-row{display:flex;align-items:center;gap:10px;font-size:13px}
.tally-row .lab{flex:0 0 76px;font-weight:500;color:var(--c)}
.tally-row .track{flex:1;height:9px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:99px;overflow:hidden}
.tally-row .fill{height:100%;background:var(--c)}
.tally-row .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;flex:0 0 34px;text-align:right;color:var(--ink-soft)}

/* ---------- log ---------- */
.log{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log-row{display:flex;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line-soft);align-items:flex-start;flex-wrap:wrap}
.log-row:last-child{border-bottom:none}
.log-date{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--gold);flex:0 0 92px}
.log-main{flex:1;min-width:180px;display:flex;flex-direction:column;gap:5px}
.log-name{font-family:"Gowun Batang",serif;font-weight:700;font-size:17px}
.log-memo{font-size:13.5px;color:var(--ink-soft)}

.section-title{
  font-family:"Gowun Batang",serif;font-weight:700;font-size:17px;
  margin:28px 0 12px;display:flex;align-items:center;gap:10px;
}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{
  border:1px dashed var(--line);border-radius:var(--r);
  padding:44px 26px;text-align:center;color:var(--ink-soft);background:var(--surface);
}
.empty .big{font-family:"Gowun Batang",serif;font-size:19px;font-weight:700;color:var(--ink);margin-bottom:8px}
.empty p{font-size:13.5px;max-width:42ch;margin:0 auto}
.notice{
  background:var(--accent-wash);border:1px solid color-mix(in oklab,var(--accent) 28%,transparent);
  border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:18px;color:var(--ink);
}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:999px;
  font-size:13px;font-weight:500;box-shadow:0 10px 30px -12px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;
  max-width:min(90vw,420px);text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer.foot{margin-top:40px;font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.7}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}
@media (max-width:560px){
  .wrap{padding:18px 14px 60px}
  .masthead{padding:18px}
  .mast-tools{align-items:stretch;width:100%}
  .me-box{width:100%}
  .me-box input{flex:1}
}
</style>
<div id="app"></div>

<script id="app-script">
(function () {
  "use strict";

  var DOC_TITLE = "제품개발팀 회식 투표소";
  var FONT_URL = "https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap";

  var CATS = [
    { id: "korean",   label: "한식",     v: "--cat-korean" },
    { id: "meat",     label: "고기·구이", v: "--cat-meat" },
    { id: "chinese",  label: "중식",     v: "--cat-chinese" },
    { id: "japanese", label: "일식",     v: "--cat-japanese" },
    { id: "western",  label: "양식",     v: "--cat-western" },
    { id: "cafe",     label: "카페",     v: "--cat-cafe" },
    { id: "etc",      label: "기타",     v: "--cat-etc" }
  ];

  function catOf(id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i];
    return CATS[CATS.length - 1];
  }

  /* ---------------- state ---------------- */

  var state = readState();
  var api = null;          // artifact capability namespace, once resolved
  var writable = null;     // null = unknown, true/false once a publish is attempted
  var saving = false;

  var ui = {
    tab: "places",
    cat: "all",
    admin: localStorage.getItem("hoesik.admin") === "1",
    me: localStorage.getItem("hoesik.me") || "",
    form: null   // null | {mode:'new'} | {mode:'edit', id}
  };

  function readState() {
    var seed = { baseAddress: "경기 성남시 중원구 둔촌대로388번길 20", places: [], votes: {} };
    try {
      var raw = document.getElementById("app-state").textContent;
      var s = JSON.parse(raw);
      if (!s || typeof s !== "object") return seed;
      s.baseAddress = s.baseAddress || seed.baseAddress;
      s.places = Array.isArray(s.places) ? s.places : [];
      s.votes = (s.votes && typeof s.votes === "object") ? s.votes : {};
      return s;
    } catch (e) {
      return seed;
    }
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function esc(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function uid() {
    return "p" + Math.random().toString(36).slice(2, 9);
  }

  function votesFor(id) {
    var v = state.votes[id];
    return Array.isArray(v) ? v : [];
  }

  function isVisited(p) { return Array.isArray(p.visits) && p.visits.length > 0; }

  function allVoters() {
    var set = {};
    Object.keys(state.votes).forEach(function (k) {
      votesFor(k).forEach(function (n) { set[n] = 1; });
    });
    return Object.keys(set);
  }

  function directionsUrl(p) {
    var dest = p.address || p.name;
    return "https://map.kakao.com/?sName=" + encodeURIComponent(state.baseAddress) +
           "&eName=" + encodeURIComponent(dest);
  }

  function today() {
    var d = new Date();
    var m = String(d.getMonth() + 1);
    var day = String(d.getDate());
    return d.getFullYear() + "-" + (m.length < 2 ? "0" + m : m) + "-" + (day.length < 2 ? "0" + day : day);
  }

  /* ---------------- persistence ---------------- */

  function fullDoc(next) {
    var css = document.getElementById("app-style").textContent;
    var js = document.getElementById("app-script").textContent;
    var data = JSON.stringify(next).replace(/</g, "\\u003c");
    return [
      "<!doctype html>",
      '<html lang="ko">',
      "<head>",
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      "<title>" + DOC_TITLE + "</title>",
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="' + FONT_URL + '">',
      '<style id="app-style">' + css + "</st" + "yle>",
      "</head>",
      "<body>",
      '<div id="app"></div>',
      '<div id="toast" role="status" aria-live="polite"></div>',
      '<script id="app-state" type="application/json">' + data + "<\/scr" + "ipt>",
      '<script id="app-script">' + js + "<\/scr" + "ipt>",
      "</body>",
      "</html>"
    ].join("\n");
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("on"); }, 3200);
  }

  function commit(next, okMsg) {
    if (saving) { toast("저장 중이에요. 잠시만요."); return; }
    state = next;
    render();
    if (!api) {
      toast("이 화면에서는 저장되지 않아요 — 변경 내용은 나에게만 보입니다.");
      return;
    }
    saving = true;
    render();
    api.publish(fullDoc(state)).then(function () {
      writable = true;
      /* 성공하면 화면이 새 버전으로 다시 로드됩니다. */
    }).catch(function (err) {
      saving = false;
      var code = (err && err.code) || "upstream_error";
      if (code === "conflict") {
        toast("다른 분이 먼저 저장했어요. 최신 내용으로 새로고침됩니다.");
      } else if (code === "not_writer" || code === "not_granted" || code === "consent_required" ||
                 code === "not_declared" || code === "capability_disabled" || code === "capability_removed") {
        writable = false;
        toast("읽기 전용으로 열려 있어요. 투표를 저장하려면 편집 권한이 필요합니다.");
      } else if (code === "rate_limited") {
        toast("저장이 잠시 밀렸어요. 몇 초 뒤 다시 눌러주세요.");
      } else if (code === "too_large") {
        toast("내용이 너무 커서 저장하지 못했어요. 오래된 기록을 정리해 주세요.");
      } else {
        toast("저장하지 못했어요. 다시 시도해 주세요.");
      }
      render();
    });
    if (okMsg) toast(okMsg);
  }

  /* ---------------- render ---------------- */

  function render() {
    var app = document.getElementById("app");
    if (!app) return;
    app.innerHTML =
      '<div class="wrap">' +
        masthead() +
        tabs() +
        (ui.tab === "places" ? placesTab() : ui.tab === "results" ? resultsTab() : logTab()) +
        foot() +
      "</div>";
  }

  function masthead() {
    var visited = state.places.filter(isVisited).length;
    return '' +
      '<header class="masthead">' +
        "<div>" +
          '<h1 class="mast-title">제품개발팀 회식 투표소</h1>' +
          '<div class="mast-sub">' +
            "<span>은지가 모아둔 후보 " + state.places.length + "곳 · 다녀온 곳 " + visited + "곳</span>" +
            '<span class="origin-tag">출발 · ' + esc(state.baseAddress) + "</span>" +
          "</div>" +
        "</div>" +
        '<div class="mast-tools">' +
          '<div class="me-box">' +
            '<label for="me-input">내 이름</label>' +
            '<input type="text" id="me-input" value="' + esc(ui.me) + '" placeholder="예: 박은지" maxlength="12">' +
            '<button class="btn btn-sm" data-act="save-me">저장</button>' +
          "</div>" +
          '<div class="me-box">' +
            '<button class="btn btn-sm" data-act="toggle-admin" aria-pressed="' + (ui.admin ? "true" : "false") + '">관리자 모드</button>' +
            (saving ? '<span class="visit-label">저장 중…</span>' : "") +
          "</div>" +
        "</div>" +
      "</header>";
  }

  function tabs() {
    var t = [
      { id: "places", label: "후보 목록", n: state.places.filter(function (p) { return !isVisited(p); }).length },
      { id: "results", label: "투표 현황", n: allVoters().length },
      { id: "log", label: "다녀온 곳", n: state.places.filter(isVisited).length }
    ];
    return '<div class="tabs" role="tablist">' + t.map(function (x) {
      return '<button class="tab" role="tab" aria-selected="' + (ui.tab === x.id ? "true" : "false") +
             '" data-act="tab" data-id="' + x.id + '">' + x.label +
             '<span class="count">' + x.n + "</span></button>";
    }).join("") + "</div>";
  }

  /* ----- tab 1: places ----- */

  function placesTab() {
    var out = "";
    if (!ui.me) {
      out += '<div class="notice">투표하려면 오른쪽 위에 <strong>내 이름</strong>을 먼저 저장해 주세요. 누가 어디에 투표했는지 투표 현황 탭에서 함께 보여요.</div>';
    }
    if (writable === false) {
      out += '<div class="notice">이 화면은 읽기 전용이에요. 투표가 저장되려면 은지님이 공유할 때 <strong>편집 가능</strong>으로 공유해야 합니다.</div>';
    }

    out += filters();

    if (ui.admin) {
      out += ui.form ? placeForm() : '<div style="margin-bottom:18px"><button class="btn btn-primary" data-act="new">+ 장소 추가</button></div>';
    }

    var list = state.places.filter(function (p) {
      return ui.cat === "all" || p.category === ui.cat;
    });
    var live = list.filter(function (p) { return !isVisited(p); });
    var done = list.filter(isVisited);

    live.sort(function (a, b) {
      var d = votesFor(b.id).length - votesFor(a.id).length;
      return d !== 0 ? d : a.name.localeCompare(b.name, "ko");
    });
    done.sort(function (a, b) { return lastVisit(b).localeCompare(lastVisit(a)); });

    if (state.places.length === 0) {
      out += '<div class="empty"><div class="big">아직 후보가 없어요</div>' +
             "<p>관리자 모드를 켜고 <strong>장소 추가</strong>를 누르면 이름·주소·메뉴·차로 걸리는 시간을 등록할 수 있어요. 등록한 순간부터 팀원들이 투표할 수 있습니다.</p></div>";
      return out;
    }

    if (live.length) out += '<div class="grid">' + live.map(card).join("") + "</div>";
    else out += '<div class="empty"><p>이 분류에는 아직 투표를 기다리는 후보가 없어요.</p></div>';

    if (done.length) {
      out += '<h2 class="section-title">이미 다녀온 곳</h2>' +
             '<div class="grid">' + done.map(card).join("") + "</div>";
    }
    return out;
  }

  function filters() {
    var counts = { all: state.places.length };
    CATS.forEach(function (c) { counts[c.id] = 0; });
    state.places.forEach(function (p) { counts[p.category] = (counts[p.category] || 0) + 1; });

    var html = '<div class="filters">' +
      '<button class="chip" data-act="cat" data-id="all" aria-pressed="' + (ui.cat === "all" ? "true" : "false") +
      '">전체<span class="n">' + counts.all + "</span></button>";
    CATS.forEach(function (c) {
      html += '<button class="chip" data-act="cat" data-id="' + c.id + '" aria-pressed="' +
              (ui.cat === c.id ? "true" : "false") + '">' + c.label +
              '<span class="n">' + (counts[c.id] || 0) + "</span></button>";
    });
    return html + "</div>";
  }

  function lastVisit(p) {
    if (!isVisited(p)) return "";
    return p.visits.map(function (v) { return v.date || ""; }).sort().pop() || "";
  }

  function card(p) {
    var c = catOf(p.category);
    var vs = votesFor(p.id);
    var mine = ui.me && vs.indexOf(ui.me) >= 0;
    var menus = Array.isArray(p.menus) ? p.menus : [];

    var html = '<article class="card' + (isVisited(p) ? " is-visited" : "") + '" style="--c:var(' + c.v + ')">';

    html += '<div class="card-body">';
    html += '<div class="card-head"><span class="cat">' + c.label + "</span>" +
            (isVisited(p) ? '<span class="stamp">다녀옴</span>' : "") +
            '<span class="drive' + (p.drive ? "" : " empty") + '">' +
            (p.drive ? "차로 " + esc(p.drive) + "분" : "소요시간 미입력") + "</span></div>";
    html += '<h3 class="place-name">' + esc(p.name) + "</h3>";

    if (p.address) {
      html += '<div class="meta"><span class="k">주소</span><span>' + esc(p.address) +
              ' <a href="' + esc(directionsUrl(p)) + '" target="_blank" rel="noopener">길찾기 ↗</a></span></div>';
    }
    if (p.area) {
      html += '<div class="meta"><span class="k">위치</span><span>' + esc(p.area) + "</span></div>";
    }
    if (menus.length) {
      html += '<div class="meta"><span class="k">메뉴</span><ul class="menus">' +
              menus.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + "</ul></div>";
    }
    if (p.note) html += '<p class="note">' + esc(p.note) + "</p>";

    if (ui.admin) {
      html += '<div class="form-actions" style="margin-top:6px">' +
              '<button class="btn btn-sm" data-act="edit" data-id="' + p.id + '">수정</button>' +
              '<button class="btn btn-sm" data-act="del" data-id="' + p.id + '">삭제</button>' +
              "</div>";
    }
    html += "</div>";

    html += '<div class="perf"></div>';
    html += '<div class="card-strip">' +
            '<button class="vote-btn" data-act="vote" data-id="' + p.id + '" aria-pressed="' + (mine ? "true" : "false") + '">' +
            (mine ? "여기 좋아요 ✓" : "여기 좋아요") + ' <span class="num">' + vs.length + "</span></button>" +
            (vs.length ? '<span class="voters">' + esc(vs.join(", ")) + "</span>" : '<span class="voters">아직 투표 없음</span>') +
            "</div>";

    html += '<div class="perf"></div>';
    html += '<div class="card-visit">' +
            '<span class="visit-label">다녀온 날짜 기록</span>';
    if (isVisited(p)) {
      html += '<ul class="visit-list">' + p.visits.slice().sort(function (a, b) {
        return String(b.date).localeCompare(String(a.date));
      }).map(function (v, i) {
        return '<li class="visit-item"><span class="d">' + esc(v.date) + '</span>' +
               '<span class="m">' + (v.memo ? esc(v.memo) : "—") + "</span>" +
               '<button class="x" data-act="del-visit" data-id="' + p.id + '" data-date="' + esc(v.date) +
               '" data-i="' + i + '" title="기록 삭제">✕</button></li>';
      }).join("") + "</ul>";
    }
    html += '<div class="visit-form">' +
            '<input type="date" id="vd-' + p.id + '" value="' + today() + '" aria-label="다녀온 날짜">' +
            '<input type="text" id="vm-' + p.id + '" placeholder="한줄 메모 (예: 8명 룸 예약)" maxlength="60" aria-label="방문 메모">' +
            '<button class="btn btn-sm" data-act="add-visit" data-id="' + p.id + '">기록</button>' +
            "</div></div>";

    html += "</article>";
    return html;
  }

  function placeForm() {
    var editing = ui.form.mode === "edit";
    var p = editing ? state.places.filter(function (x) { return x.id === ui.form.id; })[0] : null;
    if (editing && !p) { ui.form = null; return ""; }
    p = p || { name: "", category: "korean", address: "", area: "", menus: [], drive: "", note: "" };

    return '<div class="panel">' +
      "<h3>" + (editing ? "장소 수정" : "새 장소 추가") + "</h3>" +
      '<div class="form-grid">' +
        '<div class="field"><label for="f-name">가게 이름</label><input type="text" id="f-name" value="' + esc(p.name) + '" placeholder="예: 둔촌칼국수"></div>' +
        '<div class="field"><label for="f-cat">분류</label><select id="f-cat">' +
          CATS.map(function (c) {
            return '<option value="' + c.id + '"' + (p.category === c.id ? " selected" : "") + ">" + c.label + "</option>";
          }).join("") + "</select></div>" +
        '<div class="field wide"><label for="f-addr">주소</label><input type="text" id="f-addr" value="' + esc(p.address) + '" placeholder="도로명 주소를 붙여넣으세요"></div>' +
        '<div class="field"><label for="f-area">위치 설명 <span class="hint">건물·층·랜드마크</span></label><input type="text" id="f-area" value="' + esc(p.area) + '" placeholder="예: 성남산업단지 3단지 정문 앞 2층"></div>' +
        '<div class="field"><label for="f-drive">차로 걸리는 시간(분) <span class="hint">사무실 출발 기준</span></label>' +
          '<div style="display:flex;gap:6px"><input type="number" id="f-drive" min="1" max="180" value="' + esc(p.drive || "") + '" placeholder="12" style="flex:1">' +
          '<button class="btn btn-sm" data-act="check-drive" type="button">카카오맵으로 확인 ↗</button></div></div>' +
        '<div class="field wide"><label for="f-menus">대표 메뉴 <span class="hint">쉼표로 구분</span></label><input type="text" id="f-menus" value="' + esc(Array.isArray(p.menus) ? p.menus.join(", ") : "") + '" placeholder="예: 바지락칼국수, 보쌈, 왕만두"></div>' +
        '<div class="field wide"><label for="f-note">메모</label><input type="text" id="f-note" value="' + esc(p.note) + '" placeholder="예: 룸 있음 / 주차 6대 / 단체 예약 필수"></div>' +
      "</div>" +
      '<div class="form-actions">' +
        '<button class="btn btn-primary" data-act="save-place" data-id="' + (editing ? p.id : "") + '">' + (editing ? "수정 저장" : "추가하기") + "</button>" +
        '<button class="btn btn-ghost" data-act="cancel-form">취소</button>' +
        '<span class="visit-label">소요시간은 카카오맵에서 확인한 값을 직접 적어주세요</span>' +
      "</div></div>";
  }

  /* ----- tab 2: results ----- */

  function resultsTab() {
    var voters = allVoters();
    var ranked = state.places.slice().filter(function (p) { return !isVisited(p); });
    ranked.sort(function (a, b) {
      var d = votesFor(b.id).length - votesFor(a.id).length;
      return d !== 0 ? d : a.name.localeCompare(b.name, "ko");
    });
    var totalVotes = 0;
    Object.keys(state.votes).forEach(function (k) { totalVotes += votesFor(k).length; });
    var max = ranked.length ? votesFor(ranked[0].id).length : 0;

    var out = '<div class="summary">' +
      '<div class="stat"><div class="k">투표 참여</div><div class="v">' + voters.length + "<small>명</small></div></div>" +
      '<div class="stat"><div class="k">받은 표</div><div class="v">' + totalVotes + "<small>표</small></div></div>" +
      '<div class="stat"><div class="k">투표 대기 후보</div><div class="v">' + ranked.length + "<small>곳</small></div></div>" +
      '<div class="stat"><div class="k">현재 1위</div><div class="v" style="font-family:\'Gowun Batang\',serif;font-size:19px">' +
        (max > 0 ? esc(ranked[0].name) : "—") + "</div></div>" +
    "</div>";

    if (voters.length) {
      out += '<div class="notice">투표한 사람 · ' + esc(voters.join(", ")) + "</div>";
    }

    if (!ranked.length) {
      out += '<div class="empty"><div class="big">투표할 후보가 없어요</div><p>후보 목록 탭에서 장소를 추가하면 여기에 집계가 쌓입니다.</p></div>';
      return out;
    }

    out += '<div class="rank">' + ranked.map(function (p, i) {
      var c = catOf(p.category);
      var n = votesFor(p.id).length;
      var w = max > 0 ? Math.round((n / max) * 100) : 0;
      return '<div class="rank-row' + (i === 0 && n > 0 ? " top" : "") + '" style="--c:var(' + c.v + ')">' +
        '<div class="rank-n">' + (i + 1) + "</div>" +
        '<div class="rank-main">' +
          '<div class="rank-head"><span class="rank-name">' + esc(p.name) + "</span>" +
            '<span class="cat">' + c.label + "</span>" +
            (p.drive ? '<span class="drive mono">차로 ' + esc(p.drive) + "분</span>" : "") +
          "</div>" +
          '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%"></div></div>' +
          '<div class="voters">' + (n ? esc(votesFor(p.id).join(", ")) : "아직 투표 없음") + "</div>" +
        "</div>" +
        '<div class="rank-votes">' + n + "표</div>" +
      "</div>";
    }).join("") + "</div>";

    /* 카테고리별 득표 */
    var tally = {};
    CATS.forEach(function (c) { tally[c.id] = 0; });
    state.places.forEach(function (p) { tally[p.category] = (tally[p.category] || 0) + votesFor(p.id).length; });
    var tmax = 0;
    CATS.forEach(function (c) { if (tally[c.id] > tmax) tmax = tally[c.id]; });

    out += '<h2 class="section-title">분류별 선호도</h2><div class="tally">' + CATS.map(function (c) {
      var n = tally[c.id] || 0;
      var w = tmax > 0 ? Math.round((n / tmax) * 100) : 0;
      return '<div class="tally-row" style="--c:var(' + c.v + ')">' +
        '<span class="lab">' + c.label + "</span>" +
        '<span class="track"><span class="fill" style="width:' + w + '%"></span></span>' +
        '<span class="n">' + n + "표</span></div>";
    }).join("") + "</div>";

    return out;
  }

  /* ----- tab 3: visited log ----- */

  function logTab() {
    var rows = [];
    state.places.forEach(function (p) {
      (p.visits || []).forEach(function (v) {
        rows.push({ p: p, v: v });
      });
    });
    rows.sort(function (a, b) { return String(b.v.date).localeCompare(String(a.v.date)); });

    if (!rows.length) {
      return '<div class="empty"><div class="big">아직 회식 기록이 없어요</div>' +
             "<p>후보 카드 맨 아래 <strong>다녀온 날짜 기록</strong>에 날짜와 한줄 메모를 남기면 여기에 시간순으로 쌓입니다.</p></div>";
    }

    return '<div class="log">' + rows.map(function (r) {
      var c = catOf(r.p.category);
      return '<div class="log-row" style="--c:var(' + c.v + ')">' +
        '<div class="log-date">' + esc(r.v.date) + "</div>" +
        '<div class="log-main">' +
          '<div class="rank-head"><span class="log-name">' + esc(r.p.name) + "</span>" +
          '<span class="cat">' + c.label + "</span>" +
          (r.p.drive ? '<span class="drive mono">차로 ' + esc(r.p.drive) + "분</span>" : "") + "</div>" +
          (r.v.memo ? '<div class="log-memo">' + esc(r.v.memo) + "</div>" : "") +
          (r.p.address ? '<div class="voters">' + esc(r.p.address) + "</div>" : "") +
        "</div>" +
      "</div>";
    }).join("") + "</div>";
  }

  function foot() {
    return '<footer class="foot">소요시간은 사무실(' + esc(state.baseAddress) + ') 출발 · 자동차 기준으로 은지가 직접 확인해 적어둔 값이에요.<br>' +
           "카드의 길찾기 링크를 누르면 카카오맵에서 실시간 경로를 확인할 수 있습니다.</footer>";
  }

  /* ---------------- actions ---------------- */

  function val(id) {
    var el = document.getElementById(id);
    return el ? String(el.value).trim() : "";
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    var id = t.getAttribute("data-id");

    if (act === "tab") { ui.tab = id; ui.form = null; render(); return; }
    if (act === "cat") { ui.cat = id; render(); return; }

    if (act === "save-me") {
      var name = val("me-input").slice(0, 12);
      ui.me = name;
      localStorage.setItem("hoesik.me", name);
      render();
      toast(name ? name + "님으로 투표합니다." : "이름을 지웠어요.");
      return;
    }

    if (act === "toggle-admin") {
      ui.admin = !ui.admin;
      localStorage.setItem("hoesik.admin", ui.admin ? "1" : "0");
      if (!ui.admin) ui.form = null;
      render();
      return;
    }

    if (act === "new") { ui.form = { mode: "new" }; render(); return; }
    if (act === "edit") { ui.form = { mode: "edit", id: id }; ui.tab = "places"; render(); return; }
    if (act === "cancel-form") { ui.form = null; render(); return; }

    if (act === "check-drive") {
      var addr = val("f-addr") || val("f-name");
      if (!addr) { toast("주소나 가게 이름을 먼저 입력해 주세요."); return; }
      window.open("https://map.kakao.com/?sName=" + encodeURIComponent(state.baseAddress) +
                  "&eName=" + encodeURIComponent(addr), "_blank", "noopener");
      return;
    }

    if (act === "save-place") {
      var name2 = val("f-name");
      if (!name2) { toast("가게 이름은 꼭 필요해요."); return; }
      var draft = {
        name: name2,
        category: val("f-cat") || "korean",
        address: val("f-addr"),
        area: val("f-area"),
        drive: val("f-drive"),
        menus: val("f-menus").split(",").map(function (s) { return s.trim(); }).filter(Boolean),
        note: val("f-note")
      };
      var next = clone(state);
      if (id) {
        next.places = next.places.map(function (p) {
          if (p.id !== id) return p;
          return Object.assign({}, p, draft);
        });
      } else {
        draft.id = uid();
        draft.visits = [];
        next.places.push(draft);
      }
      ui.form = null;
      commit(next, id ? "수정했어요." : name2 + " 추가했어요.");
      return;
    }

    if (act === "del") {
      if (t.getAttribute("data-confirm") !== "1") {
        t.setAttribute("data-confirm", "1");
        t.textContent = "정말 삭제?";
        setTimeout(function () {
          if (t.isConnected) { t.removeAttribute("data-confirm"); t.textContent = "삭제"; }
        }, 3500);
        return;
      }
      var n2 = clone(state);
      n2.places = n2.places.filter(function (p) { return p.id !== id; });
      delete n2.votes[id];
      commit(n2, "삭제했어요.");
      return;
    }

    if (act === "vote") {
      if (!ui.me) { toast("먼저 오른쪽 위에 내 이름을 저장해 주세요."); return; }
      var n3 = clone(state);
      var list = Array.isArray(n3.votes[id]) ? n3.votes[id] : [];
      var at = list.indexOf(ui.me);
      if (at >= 0) list.splice(at, 1); else list.push(ui.me);
      n3.votes[id] = list;
      commit(n3, at >= 0 ? "투표를 취소했어요." : "투표했어요!");
      return;
    }

    if (act === "add-visit") {
      var date = val("vd-" + id);
      if (!date) { toast("날짜를 골라주세요."); return; }
      var memo = val("vm-" + id);
      var n4 = clone(state);
      n4.places = n4.places.map(function (p) {
        if (p.id !== id) return p;
        var visits = Array.isArray(p.visits) ? p.visits.slice() : [];
        visits.push({ date: date, memo: memo });
        return Object.assign({}, p, { visits: visits });
      });
      commit(n4, date + " 방문 기록 저장!");
      return;
    }

    if (act === "del-visit") {
      var d = t.getAttribute("data-date");
      var n5 = clone(state);
      n5.places = n5.places.map(function (p) {
        if (p.id !== id) return p;
        var removed = false;
        var visits = (p.visits || []).filter(function (v) {
          if (!removed && v.date === d) { removed = true; return false; }
          return true;
        });
        return Object.assign({}, p, { visits: visits });
      });
      commit(n5, "기록을 지웠어요.");
      return;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var el = e.target;
    if (!el || el.tagName !== "INPUT") return;
    if (el.id === "me-input") {
      var b = document.querySelector('[data-act="save-me"]');
      if (b) b.click();
    } else if (el.id && el.id.indexOf("vm-") === 0) {
      var pid = el.id.slice(3);
      var bb = document.querySelector('[data-act="add-visit"][data-id="' + pid + '"]');
      if (bb) bb.click();
    } else if (el.id && el.id.indexOf("f-") === 0) {
      var sb = document.querySelector('[data-act="save-place"]');
      if (sb) sb.click();
    }
  });

  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      api = ns || null;
      if (!api) { writable = false; render(); }
    }).catch(function () { api = null; writable = false; render(); });
  } else {
    writable = false;
  }
})();
</script>
